<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="50%" style="stop-color:#0d0d2e"/>
      <stop offset="100%" style="stop-color:#050510"/>
    </radialGradient>
    <radialGradient id="avatarGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#2d2d6e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </radialGradient>
    <radialGradient id="pulseRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6c63ff" stop-opacity="0"/>
      <stop offset="80%" style="stop-color:#6c63ff" stop-opacity="0.15"/>
      <stop offset="100%" style="stop-color:#6c63ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="endCallBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444"/>
      <stop offset="100%" style="stop-color:#cc0000"/>
    </linearGradient>
    <linearGradient id="acceptBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#00a884"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="avatarGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#6c63ff" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- Animated pulse rings (static representation) -->
  <circle cx="195" cy="300" r="120" fill="url(#pulseRing)" opacity="0.6"/>
  <circle cx="195" cy="300" r="100" fill="url(#pulseRing)" opacity="0.8"/>

  <!-- Floating particles -->
  <circle cx="60" cy="200" r="3" fill="#6c63ff" opacity="0.3"/>
  <circle cx="330" cy="180" r="2" fill="#00d4aa" opacity="0.3"/>
  <circle cx="80" cy="450" r="2" fill="#6c63ff" opacity="0.2"/>
  <circle cx="350" cy="400" r="3" fill="#00d4aa" opacity="0.2"/>
  <circle cx="140" cy="600" r="2" fill="#6c63ff" opacity="0.15"/>
  <circle cx="280" cy="550" r="2" fill="#00d4aa" opacity="0.15"/>

  <!-- Status Bar -->
  <text x="20" y="32" font-family="SF Pro Display, Arial" font-size="13" font-weight="600" fill="#ffffff" opacity="0.8">9:41</text>
  <rect x="340" y="20" width="24" height="12" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  <rect x="342" y="22" width="16" height="8" rx="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- Call type indicator -->
  <rect x="155" y="52" width="80" height="26" rx="13" fill="#1e1e3e" opacity="0.8"/>
  <text x="195" y="69" font-family="SF Pro Display, Arial" font-size="11" fill="#6c63ff" text-anchor="middle" font-weight="600">CHAMADA VOZ</text>

  <!-- Avatar circle (large) -->
  <circle cx="195" cy="300" r="85" fill="url(#avatarGrad)" filter="url(#avatarGlow)"/>
  <circle cx="195" cy="300" r="85" fill="none" stroke="#6c63ff" stroke-width="2" opacity="0.6"/>
  <text x="195" y="316" font-family="SF Pro Display, Arial" font-size="52" font-weight="700" fill="#6c63ff" text-anchor="middle">AM</text>

  <!-- Contact name -->
  <text x="195" y="420" font-family="SF Pro Display, Arial" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Ana Martins</text>

  <!-- Call timer -->
  <text x="195" y="452" font-family="SF Pro Display, Arial" font-size="18" fill="#00d4aa" text-anchor="middle">12:47</text>

  <!-- Signal quality -->
  <rect x="170" y="466" width="50" height="18" rx="9" fill="#1e1e3e" opacity="0.6"/>
  <text x="195" y="479" font-family="SF Pro Display, Arial" font-size="10" fill="#6b7280" text-anchor="middle">● Criptografado</text>

  <!-- Action buttons row 1 -->
  <g>
    <!-- Mute -->
    <circle cx="72" cy="570" r="34" fill="#1e1e3e"/>
    <path d="M65 563 Q65 574 72 574 Q79 574 79 563 L79 556 Q79 549 72 549 Q65 549 65 556 Z" fill="#ffffff"/>
    <path d="M61 567 Q61 579 72 579 Q83 579 83 567" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="72" y1="579" x2="72" y2="585" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <!-- Mute cross -->
    <line x1="64" y1="547" x2="80" y2="590" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/>
    <text x="72" y="618" font-family="SF Pro Display, Arial" font-size="12" fill="#8892a4" text-anchor="middle">Mudo</text>

    <!-- Speaker -->
    <circle cx="155" cy="570" r="34" fill="#1e1e3e"/>
    <path d="M144 561 L150 561 L158 554 L158 586 L150 579 L144 579 Z" fill="#ffffff"/>
    <path d="M162 558 Q168 563 168 570 Q168 577 162 582" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M165 554 Q174 562 174 570 Q174 578 165 586" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <text x="155" y="618" font-family="SF Pro Display, Arial" font-size="12" fill="#8892a4" text-anchor="middle">Alto-falante</text>

    <!-- Record -->
    <circle cx="238" cy="570" r="34" fill="#1e1e3e"/>
    <circle cx="238" cy="570" r="10" fill="#ff4444" opacity="0.8"/>
    <circle cx="238" cy="570" r="6" fill="#ff4444"/>
    <text x="238" y="618" font-family="SF Pro Display, Arial" font-size="12" fill="#8892a4" text-anchor="middle">Gravar</text>

    <!-- Add person -->
    <circle cx="321" cy="570" r="34" fill="#1e1e3e"/>
    <circle cx="318" cy="560" r="9" fill="#8892a4"/>
    <path d="M304 578 Q304 568 318 568 Q332 568 332 578" fill="#8892a4"/>
    <line x1="330" y1="555" x2="338" y2="555" stroke="#00d4aa" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="334" y1="551" x2="334" y2="559" stroke="#00d4aa" stroke-width="2.5" stroke-linecap="round"/>
    <text x="321" y="618" font-family="SF Pro Display, Arial" font-size="12" fill="#8892a4" text-anchor="middle">Adicionar</text>
  </g>

  <!-- End call button -->
  <circle cx="195" cy="710" r="44" fill="url(#endCallBtn)"/>
  <path d="M175 712 Q180 705 195 705 Q210 705 215 712 L218 717 Q217 720 214 720 L211 719 Q209 719 209 722 L209 727 Q209 730 206 730 Q202 727 200 724 Q198 730 195 730 Q192 730 190 724 Q188 727 184 730 Q181 730 181 727 L181 722 Q181 719 179 719 L176 720 Q173 720 172 717 Z" fill="#ffffff"/>
  <text x="195" y="768" font-family="SF Pro Display, Arial" font-size="12" fill="#ff6b6b" text-anchor="middle">Encerrar</text>

  <!-- Home indicator -->
  <rect x="155" y="826" width="80" height="4" rx="2" fill="#333333"/>
</svg>
