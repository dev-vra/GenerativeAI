<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="codeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e3e"/>
      <stop offset="100%" style="stop-color:#12122e"/>
    </linearGradient>
    <linearGradient id="generateBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c63ff"/>
      <stop offset="100%" style="stop-color:#4a3ff7"/>
    </linearGradient>
    <linearGradient id="shareBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#00a884"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6c63ff" flood-opacity="0.2"/>
    </filter>
    <filter id="codeShadow">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#6c63ff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- Subtle grid background -->
  <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a2e" stroke-width="0.5"/>
  </pattern>
  <rect width="390" height="844" fill="url(#grid)" opacity="0.6"/>

  <!-- Status Bar -->
  <rect width="390" height="44" fill="#0f0f0f"/>
  <text x="20" y="28" font-family="SF Pro Display, Arial" font-size="13" font-weight="600" fill="#ffffff">9:41</text>
  <rect x="340" y="16" width="24" height="12" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="342" y="18" width="16" height="8" rx="1.5" fill="#ffffff"/>

  <!-- Header -->
  <rect width="390" height="100" fill="url(#headerGrad)"/>
  <rect width="390" height="44" fill="#0f0f0f"/>

  <!-- Back arrow -->
  <path d="M22 72 L14 80 L22 88" fill="none" stroke="#00d4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="195" y="78" font-family="SF Pro Display, Arial" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Código de Convite</text>
  <text x="195" y="96" font-family="SF Pro Display, Arial" font-size="12" fill="#6b7280" text-anchor="middle">Compartilhe para iniciar uma conversa</text>

  <!-- Info card -->
  <rect x="24" y="118" width="342" height="72" rx="16" fill="#1a1a2e"/>
  <rect x="24" y="118" width="4" height="72" rx="2" fill="#6c63ff"/>
  <!-- Shield icon -->
  <path d="M50 132 Q58 130 66 134 L66 148 Q66 156 58 160 Q50 156 50 148 Z" fill="none" stroke="#6c63ff" stroke-width="1.8"/>
  <text x="50" y="154" font-family="SF Pro Display, Arial" font-size="10" fill="#6c63ff" text-anchor="middle">✓</text>
  <text x="80" y="140" font-family="SF Pro Display, Arial" font-size="13" font-weight="600" fill="#ffffff">Código de uso único</text>
  <text x="80" y="158" font-family="SF Pro Display, Arial" font-size="12" fill="#6b7280">Sem repetição · Expira após ser usado</text>
  <text x="80" y="176" font-family="SF Pro Display, Arial" font-size="12" fill="#6b7280">Nenhum dado pessoal compartilhado</text>

  <!-- Main code card -->
  <rect x="24" y="208" width="342" height="220" rx="24" fill="url(#codeCard)" filter="url(#cardShadow)"/>
  <!-- Card glow border -->
  <rect x="24" y="208" width="342" height="220" rx="24" fill="none" stroke="#6c63ff" stroke-width="1" opacity="0.4"/>

  <!-- Code display -->
  <text x="195" y="256" font-family="SF Pro Display, Arial" font-size="13" fill="#6b7280" text-anchor="middle" letter-spacing="1">SEU CÓDIGO DE CONVITE</text>

  <!-- The code -->
  <text x="195" y="310" font-family="SF Pro Mono, Courier New, monospace" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle" filter="url(#codeShadow)" letter-spacing="6">K7X-M2Q</text>
  <text x="195" y="336" font-family="SF Pro Mono, Courier New, monospace" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle" filter="url(#codeShadow)" letter-spacing="6">N9P-F4R</text>

  <!-- Expiry info -->
  <rect x="120" y="352" width="150" height="26" rx="13" fill="#12121e"/>
  <text x="195" y="368" font-family="SF Pro Display, Arial" font-size="12" fill="#ff6b6b" text-anchor="middle">⏱ Expira em 24 horas</text>

  <!-- Usage counter -->
  <text x="195" y="404" font-family="SF Pro Display, Arial" font-size="12" fill="#4a5568" text-anchor="middle">1 uso disponível · Não reutilizável</text>

  <!-- QR Code placeholder -->
  <rect x="130" y="448" width="130" height="130" rx="16" fill="#12121e" stroke="#2d2d4e" stroke-width="1"/>
  <!-- QR code simulation -->
  <g fill="#6c63ff" opacity="0.8">
    <rect x="142" y="460" width="8" height="8" rx="1"/>
    <rect x="152" y="460" width="8" height="8" rx="1"/>
    <rect x="162" y="460" width="8" height="8" rx="1"/>
    <rect x="172" y="460" width="8" height="8" rx="1"/>
    <rect x="142" y="470" width="8" height="8" rx="1"/>
    <rect x="162" y="470" width="8" height="8" rx="1"/>
    <rect x="172" y="470" width="8" height="8" rx="1"/>
    <rect x="142" y="480" width="8" height="8" rx="1"/>
    <rect x="152" y="480" width="8" height="8" rx="1"/>
    <rect x="162" y="480" width="8" height="8" rx="1"/>
    <rect x="142" y="490" width="8" height="8" rx="1"/>
    <rect x="172" y="490" width="8" height="8" rx="1"/>
    <rect x="152" y="500" width="8" height="8" rx="1"/>
    <rect x="162" y="500" width="8" height="8" rx="1"/>
    <rect x="172" y="500" width="8" height="8" rx="1"/>
    <rect x="182" y="460" width="8" height="8" rx="1"/>
    <rect x="192" y="460" width="8" height="8" rx="1"/>
    <rect x="202" y="460" width="8" height="8" rx="1"/>
    <rect x="212" y="460" width="8" height="8" rx="1"/>
    <rect x="222" y="460" width="8" height="8" rx="1"/>
    <rect x="232" y="460" width="8" height="8" rx="1"/>
    <rect x="242" y="460" width="8" height="8" rx="1"/>
    <rect x="182" y="470" width="8" height="8" rx="1"/>
    <rect x="222" y="470" width="8" height="8" rx="1"/>
    <rect x="182" y="480" width="8" height="8" rx="1"/>
    <rect x="192" y="480" width="8" height="8" rx="1"/>
    <rect x="202" y="480" width="8" height="8" rx="1"/>
    <rect x="222" y="480" width="8" height="8" rx="1"/>
    <rect x="182" y="490" width="8" height="8" rx="1"/>
    <rect x="212" y="490" width="8" height="8" rx="1"/>
    <rect x="222" y="490" width="8" height="8" rx="1"/>
    <rect x="182" y="500" width="8" height="8" rx="1"/>
    <rect x="192" y="500" width="8" height="8" rx="1"/>
    <rect x="202" y="500" width="8" height="8" rx="1"/>
    <rect x="212" y="500" width="8" height="8" rx="1"/>
    <rect x="222" y="500" width="8" height="8" rx="1"/>
    <rect x="232" y="500" width="8" height="8" rx="1"/>
    <rect x="242" y="500" width="8" height="8" rx="1"/>
    <!-- Center logo -->
    <rect x="196" y="474" width="18" height="18" rx="4" fill="#1a1a2e"/>
    <text x="205" y="487" font-family="Arial" font-size="11" font-weight="900" fill="#6c63ff" text-anchor="middle">S</text>
  </g>

  <!-- Action buttons -->
  <rect x="24" y="596" width="164" height="52" rx="26" fill="url(#generateBtn)"/>
  <text x="106" y="626" font-family="SF Pro Display, Arial" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">↻  Novo Código</text>

  <rect x="202" y="596" width="164" height="52" rx="26" fill="url(#shareBtn)"/>
  <text x="284" y="626" font-family="SF Pro Display, Arial" font-size="14" font-weight="700" fill="#0f0f0f" text-anchor="middle">↑  Compartilhar</text>

  <!-- Copy button -->
  <rect x="24" y="662" width="342" height="52" rx="26" fill="#1e1e2e" stroke="#2d2d4e" stroke-width="1"/>
  <text x="195" y="692" font-family="SF Pro Display, Arial" font-size="14" font-weight="600" fill="#8892a4" text-anchor="middle">⎘  Copiar Código</text>

  <!-- History section -->
  <text x="24" y="734" font-family="SF Pro Display, Arial" font-size="13" font-weight="600" fill="#6b7280">CONVITES USADOS</text>
  <rect x="24" y="744" width="342" height="36" rx="10" fill="#12121e"/>
  <text x="40" y="766" font-family="SF Pro Mono, Courier New, monospace" font-size="13" fill="#2d2d4e">A3B-C7D · E2F-G8H</text>
  <text x="350" y="766" font-family="SF Pro Display, Arial" font-size="11" fill="#2d2d4e" text-anchor="end">✓ Usado</text>

  <!-- Home indicator -->
  <rect x="155" y="826" width="80" height="4" rx="2" fill="#333333"/>
</svg>
