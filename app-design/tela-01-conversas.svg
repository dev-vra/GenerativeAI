  <circle cx="48" cy="252" r="26" fill="#1a1a3e" stroke="#2d2d5e" stroke-width="1"/>
  <text x="48" y="258" font-family="SF Pro Display, Arial" font-size="17" font-weight="700" fill="#6c63ff" text-anchor="middle">AM</text>
  <!-- Online indicator -->
  <circle cx="68" cy="272" r="7" fill="#0f0f0f"/>
  <circle cx="68" cy="272" r="5" fill="#00d4aa"/>
  <!-- Name and message -->
  <text x="86" y="244" font-family="SF Pro Display, Arial" font-size="16" font-weight="600" fill="#ffffff">Ana Martins</text>
  <text x="86" y="264" font-family="SF Pro Display, Arial" font-size="13" fill="#6b7280">🔒 Mensagem expira em 2h</text>
  <!-- Time and badge -->
  <text x="360" y="244" font-family="SF Pro Display, Arial" font-size="12" fill="#00d4aa" text-anchor="end">14:32</text>
  <circle cx="355" cy="265" r="11" fill="#00d4aa"/>
  <text x="355" y="270" font-family="SF Pro Display, Arial" font-size="11" font-weight="700" fill="#0f0f0f" text-anchor="middle">3</text>
  <!-- Divider -->
  <line x1="86" y1="290" x2="390" y2="290" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Item 2 -->
  <rect x="0" y="290" width="390" height="76" fill="#0f0f0f"/>
  <circle cx="48" cy="328" r="26" fill="#1e2a1e" stroke="#2d5e2d" stroke-width="1"/>
  <text x="48" y="334" font-family="SF Pro Display, Arial" font-size="17" font-weight="700" fill="#00a884" text-anchor="middle">RF</text>
  <text x="86" y="320" font-family="SF Pro Display, Arial" font-size="16" font-weight="600" fill="#ffffff">Rafael Ferreira</text>
  <text x="86" y="340" font-family="SF Pro Display, Arial" font-size="13" fill="#6b7280">Você: Ok, te vejo amanhã</text>
  <text x="360" y="320" font-family="SF Pro Display, Arial" font-size="12" fill="#6b7280" text-anchor="end">Ontem</text>
