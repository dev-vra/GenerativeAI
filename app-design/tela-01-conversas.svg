  <rect y="780" width="390" height="64" fill="#111111"/>
  <line x1="0" y1="780" x2="390" y2="780" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Chat icon (active) -->
  <rect x="18" y="793" width="22" height="18" rx="4" fill="none" stroke="#00d4aa" stroke-width="2"/>
  <path d="M22 811 L18 816 L30 811" fill="#111111" stroke="#00d4aa" stroke-width="2" stroke-linejoin="round"/>
  <text x="29" y="832" font-family="SF Pro Display, Arial" font-size="10" font-weight="600" fill="#00d4aa" text-anchor="middle">Chats</text>

  <!-- Status icon -->
  <circle cx="107" cy="802" r="9" fill="none" stroke="#4a5568" stroke-width="2"/>
  <circle cx="107" cy="802" r="5" fill="#4a5568"/>
  <text x="107" y="832" font-family="SF Pro Display, Arial" font-size="10" fill="#4a5568" text-anchor="middle">Status</text>

  <!-- Calls icon -->
  <path d="M190 795 Q194 795 196 798 L197 802 Q198 804 196 805 L194 806 Q194 810 198 814 L199 815 Q200 813 202 813 L205 814 Q208 816 208 820 Q208 822 206 823 Q203 825 200 824 Q195 822 191 818 Q187 814 186 810 Q185 807 187 804 L188 801 Q190 798 190 795Z" fill="#4a5568"/>
  <text x="197" y="832" font-family="SF Pro Display, Arial" font-size="10" fill="#4a5568" text-anchor="middle">Chamadas</text>

  <!-- Settings icon -->
  <circle cx="285" cy="803" r="8" fill="none" stroke="#4a5568" stroke-width="2"/>
  <circle cx="285" cy="803" r="3" fill="#4a5568"/>
  <text x="285" y="832" font-family="SF Pro Display, Arial" font-size="10" fill="#4a5568" text-anchor="middle">Config.</text>

  <!-- Invite icon -->
  <circle cx="363" cy="803" r="8" fill="none" stroke="#4a5568" stroke-width="2"/>
  <text x="363" y="807" font-family="SF Pro Display, Arial" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle">+</text>
  <text x="363" y="832" font-family="SF Pro Display, Arial" font-size="10" fill="#4a5568" text-anchor="middle">Convite</text>

  <!-- Home indicator -->
  <rect x="155" y="826" width="80" height="4" rx="2" fill="#333333"/>
</svg>
