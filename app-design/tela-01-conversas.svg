  <!-- Pencil icon -->
  <path d="M328 759 L323 764 L326 767 L331 762 Z" fill="#0f0f0f"/>
  <path d="M329 758 L334 754 L338 758 L333 762 Z" fill="#0f0f0f"/>
  <line x1="323" y1="764" x2="322" y2="768" stroke="#0f0f0f" stroke-width="1.5" stroke-linecap="round"/>

