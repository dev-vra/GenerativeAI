<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="fabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#00a884"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="fabShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00d4aa" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- Status Bar -->
  <rect width="390" height="44" fill="#0f0f0f"/>
  <text x="20" y="28" font-family="SF Pro Display, Arial" font-size="13" font-weight="600" fill="#ffffff">9:41</text>
  <!-- Battery, Signal icons simplified -->
  <rect x="340" y="16" width="24" height="12" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="342" y="18" width="16" height="8" rx="1.5" fill="#ffffff"/>
  <rect x="366" y="19" width="2" height="6" rx="1" fill="#ffffff"/>
  <circle cx="325" cy="22" r="3" fill="#ffffff"/>
  <circle cx="315" cy="22" r="3" fill="#ffffff"/>

  <!-- Header -->
  <rect width="390" height="110" fill="url(#headerGrad)"/>
  <rect width="390" height="44" fill="#0f0f0f"/>

  <!-- App Name -->
  <text x="22" y="82" font-family="SF Pro Display, Arial" font-size="26" font-weight="700" fill="#ffffff">Sombra</text>
  <text x="22" y="100" font-family="SF Pro Display, Arial" font-size="11" fill="#00d4aa" letter-spacing="2">MENSAGENS SEGURAS</text>

  <!-- Header Icons -->
  <!-- Search icon -->
  <circle cx="310" cy="83" r="10" fill="none" stroke="#8892a4" stroke-width="1.8"/>
  <line x1="317" y1="90" x2="322" y2="96" stroke="#8892a4" stroke-width="2" stroke-linecap="round"/>
  <!-- Menu icon -->
  <circle cx="355" cy="83" r="3" fill="#8892a4"/>
  <circle cx="365" cy="83" r="3" fill="#8892a4"/>
  <circle cx="375" cy="83" r="3" fill="#8892a4"/>

  <!-- Tab Bar -->
  <rect y="110" width="390" height="48" fill="#111111"/>
  <!-- Tabs -->
  <text x="52" y="140" font-family="SF Pro Display, Arial" font-size="13" font-weight="700" fill="#00d4aa" text-anchor="middle">MENSAGENS</text>
  <rect x="22" y="155" width="60" height="2" rx="1" fill="#00d4aa"/>

  <text x="155" y="140" font-family="SF Pro Display, Arial" font-size="13" font-weight="600" fill="#4a5568" text-anchor="middle">CHAMADAS</text>
  <text x="260" y="140" font-family="SF Pro Display, Arial" font-size="13" font-weight="600" fill="#4a5568" text-anchor="middle">TRANSMISSÃO</text>
  <text x="350" y="140" font-family="SF Pro Display, Arial" font-size="13" font-weight="600" fill="#4a5568" text-anchor="middle">CANAIS</text>

  <!-- Search Bar -->
  <rect x="16" y="166" width="358" height="40" rx="20" fill="#1e1e2e"/>
  <circle cx="38" cy="186" r="7" fill="none" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="43" y1="192" x2="47" y2="196" stroke="#4a5568" stroke-width="2" stroke-linecap="round"/>
  <text x="54" y="191" font-family="SF Pro Display, Arial" font-size="14" fill="#4a5568">Pesquisar conversa...</text>

  <!-- Conversation Items -->
