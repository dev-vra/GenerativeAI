  <text x="86" y="358" font-family="SF Pro Display, Arial" font-size="10" fill="#00d4aa">✓✓ Lida</text>
  <line x1="86" y1="366" x2="390" y2="366" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Item 3 - destruição ativa -->
  <rect x="0" y="366" width="390" height="76" fill="#120d0d"/>
  <circle cx="48" cy="404" r="26" fill="#2e1a1a" stroke="#5e2d2d" stroke-width="1"/>
  <text x="48" y="410" font-family="SF Pro Display, Arial" font-size="17" font-weight="700" fill="#ff6b6b" text-anchor="middle">LC</text>
  <text x="86" y="396" font-family="SF Pro Display, Arial" font-size="16" font-weight="600" fill="#ffffff">Lucas Carvalho</text>
  <text x="86" y="416" font-family="SF Pro Display, Arial" font-size="13" fill="#ff6b6b">⏱ Expira em 45 min</text>
  <text x="360" y="396" font-family="SF Pro Display, Arial" font-size="12" fill="#ff6b6b" text-anchor="end">13:15</text>
