  <text x="355" y="422" font-family="SF Pro Display, Arial" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <line x1="86" y1="442" x2="390" y2="442" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Item 4 -->
  <rect x="0" y="442" width="390" height="76" fill="#0f0f0f"/>
  <circle cx="48" cy="480" r="26" fill="#1a1e2e" stroke="#2d365e" stroke-width="1"/>
  <text x="48" y="486" font-family="SF Pro Display, Arial" font-size="17" font-weight="700" fill="#4dabf7" text-anchor="middle">BS</text>
  <text x="86" y="472" font-family="SF Pro Display, Arial" font-size="16" font-weight="600" fill="#ffffff">Beatriz Santos</text>
  <text x="86" y="492" font-family="SF Pro Display, Arial" font-size="13" fill="#6b7280">📎 Imagem enviada</text>
  <text x="360" y="472" font-family="SF Pro Display, Arial" font-size="12" fill="#6b7280" text-anchor="end">Seg</text>
  <line x1="86" y1="518" x2="390" y2="518" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Item 5 -->
  <rect x="0" y="518" width="390" height="76" fill="#0f0f0f"/>
  <circle cx="48" cy="556" r="26" fill="#1e1a2e" stroke="#4a2d5e" stroke-width="1"/>
  <text x="48" y="562" font-family="SF Pro Display, Arial" font-size="17" font-weight="700" fill="#cc5de8" text-anchor="middle">MO</text>
  <text x="86" y="548" font-family="SF Pro Display, Arial" font-size="16" font-weight="600" fill="#ffffff">Marcelo Oliveira</text>
  <text x="86" y="568" font-family="SF Pro Display, Arial" font-size="13" fill="#6b7280">🎵 Áudio - 0:32</text>
  <text x="360" y="548" font-family="SF Pro Display, Arial" font-size="12" fill="#6b7280" text-anchor="end">Dom</text>
  <line x1="86" y1="594" x2="390" y2="594" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Item 6 -->
  <rect x="0" y="594" width="390" height="76" fill="#0f0f0f"/>
  <circle cx="48" cy="632" r="26" fill="#1e2a1a" stroke="#2d5e3a" stroke-width="1"/>
  <text x="48" y="638" font-family="SF Pro Display, Arial" font-size="17" font-weight="700" fill="#51cf66" text-anchor="middle">JL</text>
  <text x="86" y="624" font-family="SF Pro Display, Arial" font-size="16" font-weight="600" fill="#ffffff">Julia Lima</text>
  <text x="86" y="644" font-family="SF Pro Display, Arial" font-size="13" fill="#6b7280">📞 Chamada - 12 min</text>
  <text x="360" y="624" font-family="SF Pro Display, Arial" font-size="12" fill="#6b7280" text-anchor="end">Sáb</text>
  <line x1="86" y1="670" x2="390" y2="670" stroke="#1e1e1e" stroke-width="1"/>

  <!-- FAB Button -->
